name: Verify Aurelio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run report:bundles
      - name: Start local preview
        run: |
          npm run preview > /tmp/aurelio-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/aurelio-preview.log
          exit 1
      - run: npm run test:integration
      - run: npm run test:operations
      - run: npm run test:backup
      - run: npm run test:smoke
